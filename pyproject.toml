[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kollektiv"
version = "0.4.0"
description = "Multi-agent collaborative dev team orchestrator: worker agents, TeraBox storage, GitHub sync and an LLM planner."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX expression (setuptools >= 77); the LICENSE file ships via
# license-files and pyproject no longer needs the deprecated classifier.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kollektiv contributors" }]
keywords = ["agents", "orchestration", "llm", "fastapi", "mcp", "github", "terabox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
    "cryptography>=42.0",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "mcp>=1.2",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-aiofiles",
    # Cross-checks the hand-rolled SigV4 signer against the reference
    # implementation in tests/test_r2.py (skipped when absent).
    "botocore>=1.34",
]
# Neon / Supabase / any PostgreSQL deployment (SQLModel + SQLAlchemy 2).
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/HackerxBots/Kollektiv"
Repository = "https://github.com/HackerxBots/Kollektiv"
Issues = "https://github.com/HackerxBots/Kollektiv/issues"

[project.scripts]
kollektiv = "src.api.cli:main"
kollektiv-api = "src.api.routes:main"
kollektiv-mcp = "src.api.mcp_server:main"

[tool.setuptools]
packages = [
    "config",
    "src",
    "src.agents",
    "src.api",
    "src.connectors",
    "src.db",
    "src.github",
    "src.orchestrator",
    "src.sponsors",
    "src.storage",
    "src.utils",
    # The dashboard is a static site, not a Python package: web.assets is
    # listed only because setuptools treats a data directory as one.
    "web",
    "web.assets",
]

# The dashboard ships inside the wheel: without it ``pip install kollektiv``
# would serve an API with no /ui. web/ has no __init__.py -- it is a static
# site, not a Python package -- so its files are listed explicitly here (for
# the wheel) and in MANIFEST.in (for the sdist).
[tool.setuptools.package-data]
web = ["index.html", "assets/*", "README.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are handled by the formatter
    "B008",    # FastAPI uses function calls in defaults (Depends/Query)
    "SIM108",  # explicit if/else is often clearer in async code
    # Kollektiv targets 3.11+ but deliberately uses typing.Dict/List/Optional
    # alongside ``from __future__ import annotations`` for consistency with the
    # documented public interfaces. These rules only rewrite that style.
    "UP006",
    "UP035",
    "UP037",
    "UP045",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.11"
# False: the shims in src/api/mcp_server.py intentionally carry ignores for
# both SDK generations, only one of which is installed at a time.
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["(.venv|build|dist)/"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
