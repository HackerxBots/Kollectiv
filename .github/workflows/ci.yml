name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src config examples

      - name: Tests
        run: pytest -q
        env:
          # Tests are hermetic; these keep any accidental retry fast.
          KOLLEKTIV_RETRY_BASE_DELAY: "0.01"
          KOLLEKTIV_RETRY_MAX_DELAY: "0.05"

      - name: Verify the dashboard is self-contained
        run: |
          test -f web/index.html
          ! grep -q '<script src=' web/index.html

  package:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/kollektiv check --json > /tmp/check.json || true
          head -c 400 /tmp/check.json
