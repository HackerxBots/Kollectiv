name: Feature request
description: Suggest a capability, integration or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `DECISIONS.md` lists the agreed backlog — check there first; accepted
        items already have issues.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Kollektiv makes hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should it do? Include the config/API shape you imagine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or "do nothing".
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: These are non-negotiable (see CONTRIBUTING.md).
      options:
        - label: It works without any paid service (free tier or self-hosted)
          required: true
        - label: It does not add telemetry or data collection
          required: true
        - label: Ignore the above if this is a docs-only request
          required: false
